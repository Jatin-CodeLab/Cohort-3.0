<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <h1>Tea House</h1>
        <button id="themeBtn">Dark Mode</button>
    </header>

    <section class="hero">
        <h2>Fresh & Natural Tea</h2>
        <p>Enjoy the best tea experience with us.</p>
        <button>Explore</button>
    </section>

    <section class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500" alt="">
            <h3>Green Tea</h3>
            <p>Healthy and refreshing tea.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500" alt="">
            <h3>Black Tea</h3>
            <p>Strong and energetic flavor.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=500" alt="">
            <h3>Herbal Tea</h3>
            <p>Natural herbs for wellness.</p>
        </div>
    </section>

    <footer>
        <p>Made by Student ❤️</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
